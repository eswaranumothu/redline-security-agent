  <title>REDLINE | Security That Remembers</title>

    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body,
    #root {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #050d1f;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      z-index: 1;
      min-height: 100%;
    }

    /* ── Fixed pattern layer — sits above body bg but below all content ── */
    #bg-pattern {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #0a1628;
    }

    ::-webkit-scrollbar-thumb {
      background: #1e3a5f;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 217, 255, 0.4);
    }
  </style>
</head>
